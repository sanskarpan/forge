name: Security audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit

  npm-audit:
    name: Workbench dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
