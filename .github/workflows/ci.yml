name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: cargo build
        run: cargo build --workspace
      - name: build test executables
        run: cargo test --workspace --no-run
      - name: codesign test executables
        run: |
          find target/debug/deps -type f -perm -111 \
            -exec codesign --force --entitlements entitlements.plist -s - {} \;
      - name: cargo test
        run: cargo test --workspace
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo fmt --check
        run: cargo fmt --check
      - name: codesign spike
        run: |
          cargo build --example spike -p forge-mem
          codesign --entitlements entitlements.plist -s - target/debug/examples/spike
      - name: run spike
        run: ./target/debug/examples/spike

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: cargo test
        run: cargo test --workspace --locked
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
